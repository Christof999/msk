<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="msk-logo-title msk-logo-desc">
  <title id="msk-logo-title">MSK Montage Service Kohlert</title>
  <desc id="msk-logo-desc">Logo: paperfarbener Hintergrund, dezente Haus-Silhouette, grauer Winkel, MSK-Wortmarke, blauer Akzentpunkt sowie diagonales Textband „MONTAGE SERVICE KOHLERT“.</desc>

  <defs>
    <linearGradient id="mskBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a7eb6"/>
      <stop offset="100%" stop-color="#1f5d99"/>
    </linearGradient>
    <linearGradient id="mskGrey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a4a8a8"/>
      <stop offset="100%" stop-color="#6f7376"/>
    </linearGradient>
    <clipPath id="mskFrame">
      <rect x="20" y="20" width="560" height="560" rx="48"/>
    </clipPath>
    <style><![CDATA[
      .a-frame { transform-origin: center; animation: msk-fadein .9s ease forwards; }
      .a-house { opacity: 0; animation: msk-fadein 1s ease .15s forwards; }
      .a-angle {
        stroke-dasharray: 720;
        stroke-dashoffset: 720;
        animation: msk-dash 1.6s cubic-bezier(.55,.05,.2,.95) .3s forwards;
      }
      .a-roof {
        stroke-dasharray: 460;
        stroke-dashoffset: 460;
        animation: msk-dash 1.2s cubic-bezier(.55,.05,.2,.95) .9s forwards;
      }
      .a-mono {
        opacity: 0;
        transform: translateY(14px);
        animation: msk-rise .75s ease 1.05s forwards;
      }
      .a-dot {
        opacity: 0;
        transform-origin: 470px 130px;
        animation:
          msk-pop .55s cubic-bezier(.34,1.56,.64,1) 1.35s forwards,
          msk-pulse 4s ease-in-out 2.6s infinite;
      }
      .a-band { opacity: 0; animation: msk-fadein .8s ease 1.55s forwards; }
      @keyframes msk-fadein { to { opacity: 1; } }
      @keyframes msk-dash { to { stroke-dashoffset: 0; } }
      @keyframes msk-rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes msk-pop {
        0% { opacity: 0; transform: scale(0); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes msk-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .a-frame, .a-house, .a-angle, .a-roof, .a-mono, .a-dot, .a-band {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    ]]></style>
  </defs>

  <g clip-path="url(#mskFrame)">
    <rect class="a-frame" x="20" y="20" width="560" height="560" rx="48" fill="#f6f3ec"/>

    <g class="a-house" stroke="#d9d2bf" stroke-width="6" fill="none" stroke-linejoin="round">
      <path d="M150 540 V310 L300 200 L450 310 V540 Z"/>
      <path d="M120 320 L300 180 L480 320" stroke-width="4"/>
      <path d="M260 540 V420 H340 V540" stroke-width="4"/>
    </g>

    <path class="a-angle"
          d="M105 240 V485 H470"
          fill="none"
          stroke="url(#mskGrey)"
          stroke-width="44"
          stroke-linejoin="miter"
          stroke-miterlimit="2"/>

    <path class="a-roof"
          d="M170 270 L300 165 L430 270"
          fill="none"
          stroke="url(#mskBlue)"
          stroke-width="22"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <g class="a-dot">
      <circle cx="470" cy="130" r="36" fill="url(#mskBlue)"/>
    </g>

    <text class="a-mono"
          x="300" y="430"
          text-anchor="middle"
          font-family="'Bricolage Grotesque', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="800"
          font-size="220"
          letter-spacing="-12"
          fill="url(#mskBlue)">msk</text>

    <g class="a-band" transform="translate(118 472) rotate(-26)">
      <text x="0" y="0"
            font-family="'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
            font-size="22"
            font-weight="700"
            letter-spacing="6"
            fill="#6f7376">MONTAGE SERVICE</text>
      <text x="0" y="32"
            font-family="'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
            font-size="28"
            font-weight="800"
            letter-spacing="6"
            fill="url(#mskBlue)">KOHLERT</text>
    </g>
  </g>
</svg>
