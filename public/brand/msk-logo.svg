<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-labelledby="msk-logo-title msk-logo-desc">
  <title id="msk-logo-title">MSK Montage Service Kohlert</title>
  <desc id="msk-logo-desc">Markenzeichen aus grauem Winkel, blauer Dachlinie, MSK-Wortmarke und blauem Akzentpunkt.</desc>
  <defs>
    <linearGradient id="mskBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5d9ad1"/>
      <stop offset="100%" stop-color="#2e6fa8"/>
    </linearGradient>
    <linearGradient id="mskGray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8abaa"/>
      <stop offset="100%" stop-color="#6c7174"/>
    </linearGradient>
    <style><![CDATA[
      .a-angle {
        stroke-dasharray: 360;
        stroke-dashoffset: 360;
        animation: msk-dash 1.4s cubic-bezier(.55,.05,.2,.95) .15s forwards;
      }
      .a-roof {
        stroke-dasharray: 220;
        stroke-dashoffset: 220;
        animation: msk-dash 1s cubic-bezier(.55,.05,.2,.95) .55s forwards;
      }
      .a-mono {
        opacity: 0;
        transform: translateY(10px);
        animation: msk-rise .7s ease .95s forwards;
      }
      .a-dot {
        opacity: 0;
        transform-origin: 200px 56px;
        animation:
          msk-pop .55s cubic-bezier(.34,1.56,.64,1) 1.25s forwards,
          msk-pulse 4s ease-in-out 2.4s infinite;
      }
      @keyframes msk-dash { to { stroke-dashoffset: 0; } }
      @keyframes msk-rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes msk-pop {
        0% { opacity: 0; transform: scale(0); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes msk-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .a-angle, .a-roof, .a-mono, .a-dot {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    ]]></style>
  </defs>

  <path class="a-angle"
        d="M34 60 L34 206 L180 206"
        fill="none"
        stroke="url(#mskGray)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <path class="a-roof"
        d="M58 95 L120 42 L182 95"
        fill="none"
        stroke="url(#mskBlue)"
        stroke-width="14"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <g class="a-dot">
    <circle cx="200" cy="56" r="13" fill="url(#mskBlue)"/>
  </g>

  <text class="a-mono"
        x="120" y="172"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-weight="900"
        font-size="84"
        letter-spacing="-4"
        fill="url(#mskBlue)">msk</text>
</svg>
