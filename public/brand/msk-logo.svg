<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="msk-logo-title msk-logo-desc">
  <title id="msk-logo-title">MSK Montage Service Kohlert</title>
  <desc id="msk-logo-desc">Markenzeichen mit dezenter Haus-Silhouette, grauem Winkel, blauer Dachlinie, MSK-Wortmarke und blauem Akzentpunkt sowie diagonalem Schriftband Montage Service Kohlert.</desc>

  <defs>
    <linearGradient id="mskBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a7eb6"/>
      <stop offset="100%" stop-color="#1f5d99"/>
    </linearGradient>
    <linearGradient id="mskBlueAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5d9ad1"/>
      <stop offset="100%" stop-color="#2e7ec0"/>
    </linearGradient>
    <linearGradient id="mskGrey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a4a8a8"/>
      <stop offset="100%" stop-color="#6a6e71"/>
    </linearGradient>
    <clipPath id="mskFrame">
      <rect x="20" y="20" width="560" height="560" rx="56"/>
    </clipPath>
    <style><![CDATA[
      .a-frame { animation: msk-fade .9s ease forwards; }
      .a-house { opacity: 0; animation: msk-fade 1s ease .15s forwards; }
      .a-angle {
        stroke-dasharray: 760;
        stroke-dashoffset: 760;
        animation: msk-dash 1.7s cubic-bezier(.55,.05,.2,.95) .3s forwards;
      }
      .a-roof {
        stroke-dasharray: 520;
        stroke-dashoffset: 520;
        animation: msk-dash 1.3s cubic-bezier(.55,.05,.2,.95) .9s forwards;
      }
      .a-meander {
        stroke-dasharray: 320;
        stroke-dashoffset: 320;
        animation: msk-dash 1.1s ease 1.0s forwards;
      }
      .a-mono {
        opacity: 0;
        transform: translateY(16px);
        animation: msk-rise .8s cubic-bezier(.2,.6,.2,1) 1.05s forwards;
      }
      .a-dot-ring {
        opacity: 0;
        transform-origin: 478px 122px;
        animation: msk-pop .55s cubic-bezier(.34,1.56,.64,1) 1.4s forwards;
      }
      .a-dot {
        opacity: 0;
        transform-origin: 478px 122px;
        animation:
          msk-pop .55s cubic-bezier(.34,1.56,.64,1) 1.5s forwards,
          msk-pulse 4s ease-in-out 2.7s infinite;
      }
      .a-band { opacity: 0; animation: msk-fade .8s ease 1.65s forwards; }
      @keyframes msk-fade { to { opacity: 1; } }
      @keyframes msk-dash { to { stroke-dashoffset: 0; } }
      @keyframes msk-rise { to { opacity: 1; transform: translateY(0); } }
      @keyframes msk-pop {
        0% { opacity: 0; transform: scale(0); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes msk-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
      }
      @media (prefers-reduced-motion: reduce) {
        .a-frame, .a-house, .a-angle, .a-roof, .a-meander, .a-mono, .a-dot, .a-dot-ring, .a-band {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    ]]></style>
  </defs>

  <g clip-path="url(#mskFrame)">
    <rect class="a-frame" x="20" y="20" width="560" height="560" rx="56" fill="#f6f3ec"/>

    <g class="a-house" stroke="#dfd9c9" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M150 540 V310 L300 200 L450 310 V540 Z"/>
      <path d="M120 320 L300 180 L480 320" stroke-width="3"/>
      <path d="M270 540 V430 H330 V540" stroke-width="3"/>
      <circle cx="300" cy="180" r="6" fill="#dfd9c9" stroke="none"/>
    </g>

    <path class="a-angle"
          d="M95 220 V490 H490"
          fill="none"
          stroke="url(#mskGrey)"
          stroke-width="50"
          stroke-linejoin="miter"
          stroke-miterlimit="2"/>

    <path class="a-roof"
          d="M155 280 L300 160 L445 280"
          fill="none"
          stroke="url(#mskBlue)"
          stroke-width="26"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <path class="a-meander"
          d="M210 320 H230 V340 H210 V360 H250 V340 H230"
          fill="none"
          stroke="url(#mskBlueAccent)"
          stroke-width="6"
          stroke-linecap="square"
          stroke-linejoin="miter"/>

    <g class="a-dot-ring">
      <circle cx="478" cy="122" r="48" fill="none" stroke="url(#mskBlue)" stroke-width="3" opacity="0.35"/>
    </g>
    <g class="a-dot">
      <circle cx="478" cy="122" r="36" fill="url(#mskBlue)"/>
    </g>

    <text class="a-mono"
          x="300" y="430"
          text-anchor="middle"
          font-family="'Bricolage Grotesque', 'Inter', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-weight="800"
          font-size="240"
          letter-spacing="-14"
          fill="url(#mskBlue)">msk</text>

    <g class="a-band" transform="translate(118 478) rotate(-26)">
      <text x="0" y="0"
            font-family="'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
            font-size="22"
            font-weight="700"
            letter-spacing="6"
            fill="#6a6e71">MONTAGE SERVICE</text>
      <text x="0" y="34"
            font-family="'Inter', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif"
            font-size="32"
            font-weight="900"
            letter-spacing="6"
            fill="url(#mskBlue)">KOHLERT</text>
    </g>
  </g>
</svg>
